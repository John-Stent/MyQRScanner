[versions]
agp = "8.6.0"
appcompat = "1.4.1"
codeScanner = "2.3.0"
constraintlayout = "2.1.3"
core = "3.4.0"
firebaseDatabaseKtx = "20.0.4"
googleServices = "4.3.10"
kotlin = "1.9.0"
